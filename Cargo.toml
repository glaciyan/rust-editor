[workspace]
resolver = "2"
members = [
    "crates/cutline-core",
    "crates/cutline-ffmpeg",
    "crates/cutline-engine",
    "crates/cutline-preview",
    "crates/cutline-gui",
    "crates/cutline-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.80"

[workspace.dependencies]
cutline-core = { path = "crates/cutline-core" }
cutline-ffmpeg = { path = "crates/cutline-ffmpeg" }
cutline-engine = { path = "crates/cutline-engine" }
cutline-preview = { path = "crates/cutline-preview" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
crossbeam-channel = "0.5"
dirs = "6"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
libloading = "0.8"
clap = { version = "4", features = ["derive"] }

[profile.release]
lto = "thin"
